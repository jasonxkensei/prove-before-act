        },

          "name": "What blockchain does Prove Before Act use?",

            "text": "Prove Before Act anchors proofs on the MultiversX blockchain, a high-performance, eco-friendly European blockchain. Violation detection and trust scoring run server-side today; publishing violation events to Base (Ethereum L2) is a planned integration — see the Base violations documentation for current status."
          }
        },

          "name": "How do AI agents integrate with Prove Before Act?",

            "text": "AI agents can integrate via REST API with an API key, Model Context Protocol (MCP) for autonomous decision anchoring, or x402 HTTP-native payments for zero-setup proof creation. The Agent Audit Log Standard describes the pre-execution accountability pattern: agents commit a declared decision basis (WHY), never internal chain-of-thought, before acting (WHAT)."
          }
        },

          "@type": "Question",
          "name": "Does blockchain timestamping have legal value?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Blockchain timestamping is recognized in many jurisdictions as proof of prior existence. The EU eIDAS regulation recognizes electronic timestamps, and blockchain-based proofs provide strong evidence of a document existence at a specific point in time."
          }
        },
        {
          "@type": "Question",
          "name": "What is the 4W framework?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The 4W framework (WHO/WHAT/WHEN/WHY) is the Prove Before Act Agent Proof Standard for accountability. WHO identifies the agent, WHAT records the action, WHEN timestamps it on-chain, and WHY records a declared decision basis before execution — never internal chain-of-thought. This creates a complete, verifiable audit trail for autonomous agent decisions."
          }
        },

          }
