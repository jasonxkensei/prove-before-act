name: Certify Release

on:
  push:
    branches: [main]

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: npm run build && zip -r build.zip dist/

      - name: Certify with Prove Before Act
        id: certify
        uses: jasonxkensei/prove-before-act-action@v1
        with:
          api_key: ${{ secrets.PROVEBEFOREACT_API_KEY }}
          files: 'build.zip'
          author_name: 'CI Bot'

      - name: Show proof
        run: echo "Verified at ${{ steps.certify.outputs.proof_urls }}"
