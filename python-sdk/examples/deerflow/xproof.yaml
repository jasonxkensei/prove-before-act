name: xproof_certify
display_name: Prove Before Act Blockchain Certification
description: >
  Certify any agent output on the MultiversX blockchain for
  proof-of-existence and accountability. Creates an immutable,
  timestamped record using the Prove Before Act 4W framework
  (Who, What, When, Why).
category: trust
author: Prove Before Act
version: "0.1.0"
homepage: https://provebeforeact.com
repository: https://github.com/jasonxkensei/prove-before-act

parameters:
  - name: content
    type: string
    required: true
    description: The text content to certify on-chain.
  - name: file_name
    type: string
    required: false
    default: "deerflow-output.json"
    description: A descriptive name for the certification record.
  - name: author
    type: string
    required: false
    description: >
      Override the agent name used in the certification metadata.
      Defaults to the skill's configured agent_name.
  - name: why
    type: string
    required: false
    default: "skill_certification"
    description: >
      Legacy fingerprint-only 4W "Why" field. It is reduced to a SHA-256
      fingerprint before serialization and is NOT a human-readable reason —
      pass a fixed action classification or opaque ID, never free-text
      rationale.

output:
  type: json
  fields:
    - name: proof_id
      type: string
      description: Unique identifier for the blockchain proof.
    - name: file_hash
      type: string
      description: SHA-256 hash of the certified content.
    - name: transaction_hash
      type: string
      description: MultiversX transaction hash anchoring the proof.
    - name: status
      type: string
      description: Always "certified" on success.

example:
  input: |
    {
      "content": "Q3 revenue analysis: $4.2M, up 15% YoY",
      "file_name": "q3-analysis.json",
      "why": "earnings_certification"
    }
  output: |
    {
      "proof_id": "proof-abc123",
      "file_hash": "a1b2c3d4e5f6...",
      "transaction_hash": "0xdeadbeef...",
      "status": "certified"
    }

dependencies:
  python:
    - "prove-before-act>=0.1.0" # `xproof` remains the legacy Python module name.

env:
  - name: PROVEBEFOREACT_API_KEY
    required: true
    description: Your Prove Before Act API key (get one at https://provebeforeact.com).
